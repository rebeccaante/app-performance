<div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-800">Area Personale</h1>
        <p class="text-sm text-slate-500 mt-2">Inserisci la tua email aziendale per accedere al modulo preposto.</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Aziendale</label>
            <input 
                type="email" 
                id="email" 
                required 
                placeholder="nome.cognome@hqe.it"
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
        </div>

        <button 
            type="submit" 
            id="submitBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center justify-center"
        >
            <span id="btnText">Accedi al Modulo</span>
            <span id="loader" class="hidden animate-spin ml-2">🌀</span>
        </button>
    </form>

    <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg text-center"></div>
</div>

<script>
    // CONFIGURAZIONE SUPABASE - Inserisci le tue chiavi ottenute da Supabase
    const SUPABASE_URL = "https://icwvqpdhloeegwcgmgpa.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_3JQdZmfHynkXkDT8t-0sxQ_1vZ13u9r";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // LINK AI MODULI GOOGLE
    const FORM_COORDINATOR = "https://forms.gle/kFVf7fZQ29R1iWyG9";
    const FORM_CONSULENTI = "https://forms.gle/5mvhoogatn8mkfmGA";
    const FORM_GENERALE = "https://forms.gle/ZgR3t5SwTnQ8zsj69";

    async function handleLogin(event) {
        event.preventDefault();
        
        const emailInput = document.getElementById('email').value.trim().toLowerCase();
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');

        errorDiv.classList.add('hidden');
        submitBtn.disabled = true;
        btnText.textContent = "Verifica in corso...";
        loader.classList.remove('hidden');

        try {
            // Interrogazione al database Supabase
            const { data: user, error } = await supabaseClient
                .from('dipendenti')
                .select('*')
                .eq('email', emailInput)
                .maybeSingle();

            if (error) throw error;

            if (!user) {
                throw new Error("Indirizzo email non trovato nell'anagrafica aziendale.");
            }

            // Logica di Routing prioritario
            if (user.is_coordinator) {
                window.location.href = FORM_COORDINATOR;
            } else if (user.team && user.team.toUpperCase() === 'CONSULENZA') {
                window.location.href = FORM_CONSULENTI;
            } else {
                window.location.href = FORM_GENERALE;
            }

        } catch (err) {
            errorDiv.textContent = err.message || "Si è verificato un errore durante la verifica.";
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            btnText.textContent = "Accedi al Modulo";
            loader.classList.add('hidden');
        }
    }
</script>
